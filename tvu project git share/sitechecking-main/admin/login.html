<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | TVU Books & Materials</title>
  <link rel="icon" type="image/png" href="../assets/tvu-logo.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="admin-login-box">
      
      <div style="margin-bottom:1.5rem;">
        <img src="../assets/tvu-logo.png" alt="TVU Logo" style="width:64px; height:64px; border-radius:12px; margin-bottom:0.75rem;" onerror="this.src='https://via.placeholder.com/64?text=TVU'">
        <h2 style="font-size:1.45rem; font-weight:800; color:var(--admin-primary); margin-bottom:0.25rem;">TVU Academic Admin</h2>
        <p style="font-size:0.85rem; color:var(--admin-muted);">Thiruvalluvar University Resources & Moderation Portal</p>
      </div>

      <div id="admin-login-alert" style="display:none;"></div>

      <p style="font-size:0.875rem; color:var(--admin-text); line-height:1.5; margin-bottom:1.5rem; background:#f8fafc; padding:0.85rem; border-radius:8px; border:1px solid var(--admin-border);">
        🔒 Restricted to authorized university administrators and faculty reviewers.
      </p>

      <button type="button" class="btn-admin btn-primary-admin" onclick="loginAdminWithGoogle()" style="width:100%; justify-content:center; padding:0.85rem; font-size:0.95rem; border-radius:8px; margin-bottom:1.25rem; background:#0f2744;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5rem;"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/></svg>
        Sign in with Authorized Google Account
      </button>

      <div style="border-top:1px solid var(--admin-border); padding-top:1.25rem;">
        <a href="../index.html" style="font-size:0.825rem; color:var(--admin-muted); text-decoration:none; font-weight:600;">
          ← Return to TVU Books & Materials Marketplace
        </a>
      </div>

    </div>
  </div>

  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- App Core Modules -->
  <script src="../js/firebase-config.js"></script>
  <script src="js/admin-auth.js"></script>

</body>
</html>
